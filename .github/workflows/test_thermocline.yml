name: Test Thermocline

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy matplotlib
      - run: python test_thermocline.py
      - uses: actions/upload-artifact@v4
        with:
          name: thermocline-plot
          path: thermocline_plot.png