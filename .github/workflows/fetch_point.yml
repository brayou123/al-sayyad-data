name: Fetch Point Data

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install copernicusmarine xarray netCDF4 numpy scipy h5py

      - name: Run fetch_point
        env:
          COPERNICUSMARINE_USERNAME: ${{ secrets.COPERNICUS_USER }}
          COPERNICUSMARINE_PASSWORD: ${{ secrets.COPERNICUS_PASS }}
        run: python fetch_point.py