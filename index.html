<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Hotspots — Al-Sayyad</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=IBM+Plex+Mono:wght@400;500&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #060d14;
    --surface: #0b1623;
    --surface2: #101f30;
    --border: #1a2e44;
    --accent: #00d4ff;
    --accent2: #0099bb;
    --text: #c8dde8;
    --text-dim: #4a6a80;
    --radius: 10px;
    --sheet-collapsed: 64px;
    --sheet-mid: 55vh;
    --sheet-full: 92vh;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: 'Tajawal', sans-serif; color: var(--text); }

  #map { position: fixed; inset: 0; z-index: 1; }
  .leaflet-tile-pane { filter: brightness(0.52) saturate(0.65) hue-rotate(195deg); }
  .leaflet-control-zoom { margin-bottom: calc(var(--sheet-collapsed) + 16px) !important; }

  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 100;
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-radius: 18px 18px 0 0;
    display: flex; flex-direction: column;
    transition: height 0.38s cubic-bezier(0.32,0.72,0,1);
    height: var(--sheet-mid);
    will-change: height; touch-action: none;
  }
  #sheet.collapsed { height: var(--sheet-collapsed); }
  #sheet.full      { height: var(--sheet-full); }

  #drag-handle {
    width: 100%; padding: 10px 0 6px;
    display: flex; justify-content: center; align-items: center;
    cursor: grab; flex-shrink: 0;
  }
  #drag-handle::after {
    content: ''; width: 38px; height: 4px;
    border-radius: 2px; background: var(--border);
  }

  #sheet-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px 10px; flex-shrink: 0;
  }
  #sheet-title {
    font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800;
    letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--accent); text-shadow: 0 0 16px rgba(0,212,255,0.35);
    display: flex; align-items: center; gap: 12px;
  }
  #gps-badge {
    display: flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--text-dim);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 10px;
  }
  .gps-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim); flex-shrink: 0;
    transition: background 0.4s, box-shadow 0.4s;
  }
  .gps-dot.active { background: #22cc77; box-shadow: 0 0 6px #22cc77; animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

  #sheet-body {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 4px 0 20px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  #sheet.collapsed #sheet-body { overflow: hidden; }

  #nav-bar {
    display: none; align-items: center; justify-content: space-between;
    padding: 0 18px; height: var(--sheet-collapsed); flex-shrink: 0;
  }
  #sheet.collapsed #nav-bar    { display: flex; }
  #sheet.collapsed #sheet-header,
  #sheet.collapsed #sheet-body { display: none; }

  .nav-result-pill {
    display: flex; align-items: center; gap: 8px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-dim);
  }
  .nav-count { color: var(--accent); font-size: 14px; font-weight: 700; }
  #expand-btn {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; color: var(--text);
    font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 700;
    letter-spacing: 1px; padding: 7px 14px; cursor: pointer; transition: all 0.2s;
  }
  #expand-btn:hover { border-color: var(--accent); color: var(--accent); }

  .toggle-wrap {
    display: flex;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    font-size: 9px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .toggle-option {
    padding: 4px 12px;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-dim);
  }
  .toggle-option.active {
    background: var(--accent);
    color: #000;
    font-weight: 700;
  }

  .species-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin: 8px 12px;
    padding: 12px 14px;
    background: var(--surface2);
  }
  .species-card h4 {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .species-card .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #00aaff;
    display: inline-block;
  }
  .species-card .values {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
  }
  .species-card .values .val {
    color: var(--text);
  }

  .search-wrap { padding: 12px 12px 8px; }
  #search-btn {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none; border-radius: var(--radius);
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 800;
    letter-spacing: 3px; text-transform: uppercase; color: #000; cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s, opacity 0.2s;
    box-shadow: 0 0 20px rgba(0,212,255,0.2);
  }
  #search-btn:hover { box-shadow: 0 0 28px rgba(0,212,255,0.4); }
  #search-btn:active { transform: scale(0.97); }
  #search-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #results-bar {
    padding: 8px 12px 4px; font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; color: var(--text-dim); min-height: 28px;
    display: flex; align-items: center; gap: 7px;
  }
  .result-count { color: var(--accent); font-weight: 500; font-size: 11px; }
  .spinner {
    width: 12px; height: 12px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #hotspot-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  #hotspot-popup {
    position: fixed;
    background: rgba(6,13,20,0.96); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    z-index: 600; display: none; min-width: 190px; max-width: 240px;
    backdrop-filter: blur(10px); pointer-events: none;
    animation: popIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #hotspot-popup h3 { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 800; margin-bottom: 6px; }
  .popup-match { font-size: 22px; font-weight: 700; margin-bottom: 5px; font-family: 'Syne', sans-serif; }
  .popup-dist { font-size: 10px; color: var(--text-dim); margin-bottom: 8px; }
  .popup-vars { color: var(--text-dim); font-size: 9px; line-height: 1.8; border-top: 1px solid var(--border); padding-top: 7px; }
  .popup-var-item::before { content: '· '; color: var(--accent); }
</style>
</head>
<body>

<div id="map"></div>
<canvas id="hotspot-canvas"></canvas>

<div id="hotspot-popup">
  <h3 id="popup-name"></h3>
  <div class="popup-match" id="popup-pct"></div>
  <div class="popup-dist" id="popup-dist"></div>
  <div class="popup-vars" id="popup-vars"></div>
</div>

<div id="sheet">
  <div id="drag-handle"></div>

  <div id="sheet-header">
    <div id="sheet-title">
      🎣 Hotspots
      <div class="toggle-wrap" id="toggle-wrap">
        <div class="toggle-option active" data-mode="literature">📘 Literature</div>
        <div class="toggle-option" data-mode="real">🎯 Real</div>
      </div>
    </div>
    <div id="gps-badge">
      <div class="gps-dot" id="gps-dot"></div>
      <span id="gps-text">Locating…</span>
    </div>
  </div>

  <div id="nav-bar">
    <div class="nav-result-pill">
      <span class="nav-count" id="nav-count">0</span>
      <span>hotspots found</span>
    </div>
    <button id="expand-btn">▲ ADJUST</button>
  </div>

  <div id="sheet-body">
    <!-- بطاقة Sardine الوحيدة -->
    <div class="species-card" id="sardine-card">
      <h4><span class="dot" style="background:#00aaff;"></span> Sardine (Sardina pilchardus)</h4>
      <div class="values" id="sardine-values">
        <span>Temp: <span class="val" id="sardine-temp">13–22 °C</span></span>
        <span>O₂: <span class="val" id="sardine-o2">5.5–8.5 ml/l</span></span>
        <span>Chl: <span class="val" id="sardine-chl">0.5–4.0 mg/m³</span></span>
        <span>Salinity: <span class="val" id="sardine-sal">36–38.5 ppt</span></span>
        <span>Secchi: <span class="val" id="sardine-secchi">5–25 m</span></span>
        <span>Current: <span class="val" id="sardine-current">0–1.0 kn</span></span>
        <span>Thermocline: <span class="val" id="sardine-thermo">20–40 m</span></span>
      </div>
    </div>

    <div class="search-wrap">
      <button id="search-btn" disabled>SEARCH HOTSPOTS</button>
    </div>
    <div id="results-bar">
      <span id="results-text">Select species and press Search.</span>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ============================================================
//  CONSTANTS & GLOBALS
// ============================================================

const SEARCH_RADIUS_KM = 100;

// القيم الأدبية للسردين (كما في السكربت)
const LIT_RANGES = {
  temperature:  [13, 22],
  oxygen:       [5.5, 8.5],
  chlorophyll:  [0.5, 4.0],
  salinity:     [36, 38.5],
  transparency: [5, 25],
  currentSpeed: [0, 1.0],
  thermocline:  [20, 40]
};

// القيم الواقعية (من الصيد الناجح)
const REAL_VALUES = {
  temperature:  20.89,
  oxygen:       5.29,
  chlorophyll:  0.085,
  salinity:     36.72,
  transparency: 43.3,
  currentSpeed: 0.11,
  thermocline:  14.8
};

// التسامحات الواقعية (من السكربت)
const REAL_TOLERANCES = {
  temperature:  1.5,
  oxygen:       0.5,
  chlorophyll:  0.5,
  salinity:     0.5,
  transparency: 15,
  currentSpeed: 0.3,
  thermocline:  6
};

// App state
let userLat = null, userLon = null;
let map, userMarker, radiusCircle;
let hotspotResults = [];
let animFrame;
let fullData = null;
let currentMode = 'literature';
let allPoints = [];

// ============================================================
//  UTILITIES
// ============================================================

function haversineKm(la1, lo1, la2, lo2) {
  const R = 6371;
  const dL = (la2 - la1) * Math.PI / 180;
  const dO = (lo2 - lo1) * Math.PI / 180;
  const a = Math.sin(dL/2)**2 + Math.cos(la1*Math.PI/180) * Math.cos(la2*Math.PI/180) * Math.sin(dO/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function hexA(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${Math.max(0, Math.min(1, alpha)).toFixed(2)})`;
}

// ============================================================
//  UPDATE SARDINE CARD
// ============================================================

function updateSardineCard(mode) {
  const card = document.getElementById('sardine-values');
  if (mode === 'literature') {
    document.getElementById('sardine-temp').textContent = `${LIT_RANGES.temperature[0]}–${LIT_RANGES.temperature[1]} °C`;
    document.getElementById('sardine-o2').textContent = `${LIT_RANGES.oxygen[0]}–${LIT_RANGES.oxygen[1]} ml/l`;
    document.getElementById('sardine-chl').textContent = `${LIT_RANGES.chlorophyll[0]}–${LIT_RANGES.chlorophyll[1]} mg/m³`;
    document.getElementById('sardine-sal').textContent = `${LIT_RANGES.salinity[0]}–${LIT_RANGES.salinity[1]} ppt`;
    document.getElementById('sardine-secchi').textContent = `${LIT_RANGES.transparency[0]}–${LIT_RANGES.transparency[1]} m`;
    document.getElementById('sardine-current').textContent = `${LIT_RANGES.currentSpeed[0]}–${LIT_RANGES.currentSpeed[1]} kn`;
    document.getElementById('sardine-thermo').textContent = `${LIT_RANGES.thermocline[0]}–${LIT_RANGES.thermocline[1]} m`;
  } else {
    document.getElementById('sardine-temp').textContent = `${REAL_VALUES.temperature} ±${REAL_TOLERANCES.temperature} °C`;
    document.getElementById('sardine-o2').textContent = `${REAL_VALUES.oxygen} ±${REAL_TOLERANCES.oxygen} ml/l`;
    document.getElementById('sardine-chl').textContent = `${REAL_VALUES.chlorophyll} ±${REAL_TOLERANCES.chlorophyll} mg/m³`;
    document.getElementById('sardine-sal').textContent = `${REAL_VALUES.salinity} ±${REAL_TOLERANCES.salinity} ppt`;
    document.getElementById('sardine-secchi').textContent = `${REAL_VALUES.transparency} ±${REAL_TOLERANCES.transparency} m`;
    document.getElementById('sardine-current').textContent = `${REAL_VALUES.currentSpeed} ±${REAL_TOLERANCES.currentSpeed} kn`;
    document.getElementById('sardine-thermo').textContent = `${REAL_VALUES.thermocline} ±${REAL_TOLERANCES.thermocline} m`;
  }
}

// ============================================================
//  DATA LOADING
// ============================================================

async function loadHotspotsData() {
  try {
    const response = await fetch('hotspots.json');
    if (!response.ok) throw new Error(`HTTP ${response.status} — file not found`);
    const json = await response.json();
    fullData = json;
    // Set initial mode
    setMode('literature');
    document.getElementById('results-text').innerHTML =
      `✅ Loaded ${json.literature?.length || 0} lit, ${json.real?.length || 0} real · ${json.timestamp}`;
    enableSearchIfReady();
  } catch (err) {
    console.error('Failed to load hotspots.json:', err);
    document.getElementById('results-text').innerHTML = '❌ Failed to load hotspots.json. Check that the file exists.';
    fullData = null;
    allPoints = [];
    enableSearchIfReady();
  }
}

// ============================================================
//  MODE TOGGLE
// ============================================================

function setMode(mode) {
  if (mode === currentMode && fullData) return; // avoid unnecessary redraw
  currentMode = mode;
  // Update toggle buttons
  document.querySelectorAll('.toggle-option').forEach(el => {
    el.classList.toggle('active', el.dataset.mode === mode);
  });
  // Update Sardine card
  updateSardineCard(mode);
  // Update points reference
  if (fullData) {
    allPoints = fullData[mode] || [];
  } else {
    allPoints = [];
  }
  // Show points for the new mode (if data loaded and GPS available)
  if (fullData && userLat) {
    showCurrentModePoints();
  } else {
    // Clear existing points
    hotspotResults = [];
    drawHotspots();
    document.getElementById('nav-count').textContent = '0';
    if (!fullData) {
      document.getElementById('results-text').innerHTML = '⚠️ Data not loaded.';
    } else if (!userLat) {
      document.getElementById('results-text').innerHTML = '📍 Waiting for location...';
    }
  }
}

// ============================================================
//  CLUSTERING
// ============================================================

function clusterHotspots(rawPoints) {
  const CLUSTER_RADIUS_KM = 1.5;
  const used = new Array(rawPoints.length).fill(false);
  const clusters = [];

  for (let i = 0; i < rawPoints.length; i++) {
    if (used[i]) continue;
    const seed = rawPoints[i];
    const members = [seed];
    used[i] = true;

    for (let j = i + 1; j < rawPoints.length; j++) {
      if (used[j]) continue;
      if (haversineKm(seed.lat, seed.lon, rawPoints[j].lat, rawPoints[j].lon) <= CLUSTER_RADIUS_KM) {
        members.push(rawPoints[j]);
        used[j] = true;
      }
    }

    const avgLat = members.reduce((s, p) => s + p.lat, 0) / members.length;
    const avgLon = members.reduce((s, p) => s + p.lon, 0) / members.length;
    const avgMatch = members.reduce((s, p) => s + p.score, 0) / members.length;
    const best = members.reduce((a, b) => a.score > b.score ? a : b);

    const radiusKm = members.length === 1
      ? 0.5
      : Math.max(...members.map(p => haversineKm(avgLat, avgLon, p.lat, p.lon)));

    const speciesMap = {};
    members.forEach(p => {
      (p.species || []).forEach(sp => {
        if (!speciesMap[sp.id] || sp.score > speciesMap[sp.id].score) {
          speciesMap[sp.id] = sp;
        }
      });
    });
    const allSpecies = Object.values(speciesMap).sort((a, b) => b.score - a.score);

    clusters.push({
      lat:       avgLat,
      lon:       avgLon,
      match:     +avgMatch.toFixed(1),
      radiusKm:  +radiusKm.toFixed(1),
      count:     members.length,
      color:     best.color,
      name:      best.name,
      allSpecies,
      isFront:   false,
      pointData: best.data || {}
    });
  }

  clusters.sort((a, b) => b.match - a.match);
  return clusters;
}

// ============================================================
//  SHOW CURRENT MODE POINTS
// ============================================================

function showCurrentModePoints() {
  if (!fullData) {
    document.getElementById('results-text').innerHTML = '❌ No data loaded.';
    return;
  }

  let points = fullData[currentMode] || [];
  if (!points.length) {
    document.getElementById('results-text').innerHTML = `⚠️ No hotspots found in ${currentMode} mode.`;
    hotspotResults = [];
    drawHotspots();
    document.getElementById('nav-count').textContent = '0';
    return;
  }

  // Filter by radius if GPS available
  if (userLat) {
    points = points.filter(p =>
      haversineKm(userLat, userLon, p.lat, p.lon) <= SEARCH_RADIUS_KM
    );
  }

  // Cluster
  hotspotResults = clusterHotspots(points);
  drawHotspots();
  document.getElementById('nav-count').textContent = hotspotResults.length;
  document.getElementById('results-text').innerHTML =
    `${hotspotResults.length} hotspots found (${currentMode})` +
    (userLat ? ` within ${SEARCH_RADIUS_KM}km` : '');
}

// ============================================================
//  MAP & CANVAS
// ============================================================

map = L.map('map', { zoomControl: false, attributionControl: false }).setView([36.7, 3.1], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
L.control.zoom({ position: 'bottomright' }).addTo(map);

const canvasEl = document.getElementById('hotspot-canvas');
const ctx = canvasEl.getContext('2d');

function resizeCanvas() {
  canvasEl.width  = window.innerWidth;
  canvasEl.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); drawHotspots(); });
map.on('move zoom', drawHotspots);

let phase = 0;

function drawHotspots() {
  cancelAnimationFrame(animFrame);
  ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
  if (!hotspotResults.length) return;

  function loop() {
    ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    phase += 0.018;

    hotspotResults.forEach(h => {
      const center  = map.latLngToContainerPoint([h.lat, h.lon]);
      const edgePt  = map.latLngToContainerPoint([
        h.lat,
        h.lon + (h.radiusKm / 111) * (1 / Math.cos(h.lat * Math.PI / 180))
      ]);
      const pxRadius = Math.max(18, Math.hypot(edgePt.x - center.x, edgePt.y - center.y));
      const pulse    = 0.75 + 0.25 * Math.sin(phase + h.lat * 6 + h.lon * 4);
      const species  = h.allSpecies || [{ color: h.color, match: h.match }];

      species.forEach((sp, idx) => {
        const ringR = pxRadius * (1 - idx * 0.18);
        if (ringR < 8) return;
        const alpha = (0.12 - idx * 0.03) * pulse;
        const grad  = ctx.createRadialGradient(center.x, center.y, ringR * 0.3, center.x, center.y, ringR);
        grad.addColorStop(0,   hexA(sp.color, alpha * 2.5));
        grad.addColorStop(0.6, hexA(sp.color, alpha));
        grad.addColorStop(1,   hexA(sp.color, 0));
        ctx.beginPath();
        ctx.arc(center.x, center.y, ringR, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
      });

      ctx.beginPath();
      ctx.arc(center.x, center.y, pxRadius, 0, Math.PI * 2);
      ctx.strokeStyle = hexA(h.color, 0.35 * pulse);
      ctx.lineWidth   = h.isFront ? 2 : 1;
      ctx.setLineDash(h.isFront ? [] : [5, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      if (h.isFront) {
        ctx.beginPath();
        ctx.arc(center.x, center.y, pxRadius + 5 * pulse, 0, Math.PI * 2);
        ctx.strokeStyle = hexA('#ffdd00', 0.45 * pulse);
        ctx.lineWidth   = 1.5;
        ctx.stroke();
      }

      const dotR = 5 + 3 * pulse;
      ctx.beginPath();
      ctx.arc(center.x, center.y, dotR, 0, Math.PI * 2);
      ctx.fillStyle   = hexA(h.color, 0.95);
      ctx.shadowColor = h.color;
      ctx.shadowBlur  = 14;
      ctx.fill();
      ctx.shadowBlur  = 0;

      if (map.getZoom() >= 8) {
        ctx.font      = 'bold 10px IBM Plex Mono, monospace';
        ctx.fillStyle = hexA(h.color, 0.9);
        ctx.textAlign = 'center';
        ctx.fillText(h.match.toFixed(0) + '%', center.x, center.y - dotR - 4);
      }
    });

    animFrame = requestAnimationFrame(loop);
  }
  loop();
}

// ============================================================
//  POPUP
// ============================================================

map.getContainer().addEventListener('click', e => {
  const mx = e.clientX, my = e.clientY;
  const popup = document.getElementById('hotspot-popup');
  let hit = null, bestD = Infinity;

  hotspotResults.forEach(h => {
    const center  = map.latLngToContainerPoint([h.lat, h.lon]);
    const edgePt  = map.latLngToContainerPoint([
      h.lat, h.lon + (h.radiusKm / 111) * (1 / Math.cos(h.lat * Math.PI / 180))
    ]);
    const pxRadius = Math.max(18, Math.hypot(edgePt.x - center.x, edgePt.y - center.y));
    const d = Math.hypot(center.x - mx, center.y - my);
    if (d <= pxRadius && d < bestD) { bestD = d; hit = h; }
  });

  if (hit) {
    popup.style.display = 'block';
    let left = mx + 16, top = my - 20;
    if (left + 250 > window.innerWidth  - 10) left = mx - 266;
    if (top  + 260 > window.innerHeight - 80) top  = my - 270;
    popup.style.left = left + 'px';
    popup.style.top  = top  + 'px';
    popup.style.borderColor = hit.color;

    const nameEl = document.getElementById('popup-name');
    if (hit.allSpecies && hit.allSpecies.length > 1) {
      nameEl.innerHTML = hit.allSpecies
        .map(s => `<span style="color:${s.color}">● ${s.name} ${s.score.toFixed(0)}%</span>`)
        .join('<br>');
    } else {
      nameEl.style.color = hit.color;
      nameEl.textContent = hit.name;
    }

    const pctEl = document.getElementById('popup-pct');
    pctEl.style.color = hit.color;
    pctEl.textContent = hit.match.toFixed(0) + '% match';

    if (userLat) {
      const km = haversineKm(userLat, userLon, hit.lat, hit.lon);
      document.getElementById('popup-dist').textContent =
        '📍 ' + (km < 1 ? `${(km * 1000).toFixed(0)} m` : `${km.toFixed(1)} km`) +
        `  ·  ~${hit.radiusKm} km zone  ·  ${hit.count} pts`;
    }

    const varsEl = document.getElementById('popup-vars');
    varsEl.innerHTML = '';
    const pd = hit.pointData || {};
    const varList = [
      { key:'temp',  label:'🌡️ Temp',      unit:'°C',    dec:1 },
      { key:'chl',   label:'🟢 Chl',        unit:'mg/m³', dec:2 },
      { key:'o2',    label:'💧 O₂',         unit:'ml/l',  dec:2 },
      { key:'sal',   label:'🧂 Salinity',    unit:'ppt',   dec:1 },
      { key:'secchi',label:'👁️ Secchi',      unit:'m',     dec:0 },
      { key:'current',label:'🌊 Current',     unit:'kn',    dec:2 },
      { key:'thermo', label:'📏 Thermocline', unit:'m',     dec:0 },
      { key:'bathy',  label:'📐 Depth',       unit:'m',     dec:0 }
    ];
    varList.forEach(v => {
      const val = pd[v.key];
      const d   = document.createElement('div');
      d.className = 'popup-var-item';
      d.textContent = val != null
        ? `${v.label}: ${val.toFixed(v.dec)} ${v.unit}`
        : `${v.label}: —`;
      if (val == null) d.style.opacity = '0.4';
      varsEl.appendChild(d);
    });
  } else {
    popup.style.display = 'none';
  }
});

// ============================================================
//  GPS
// ============================================================

let gpsStatus = 'waiting';

function setGPSText(t) {
  document.getElementById('gps-text').textContent = t;
}

function updateGPSDot(active) {
  const dot = document.getElementById('gps-dot');
  if (active) dot.classList.add('active');
  else dot.classList.remove('active');
}

function enableSearchIfReady() {
  if (userLat && fullData) {
    document.getElementById('search-btn').disabled = false;
  } else if (!userLat) {
    document.getElementById('search-btn').disabled = true;
    if (gpsStatus === 'denied')
      document.getElementById('results-text').innerHTML = '⚠️ Location access denied. Enable GPS.';
    else if (gpsStatus === 'error')
      document.getElementById('results-text').innerHTML = '⚠️ Could not get location. Try reloading.';
    else
      document.getElementById('results-text').innerHTML = '📍 Waiting for location...';
  } else if (!fullData) {
    document.getElementById('search-btn').disabled = true;
    document.getElementById('results-text').innerHTML = '<div class="spinner"></div> Loading hotspots data...';
  }
}

function initGPS() {
  if (!navigator.geolocation) {
    gpsStatus = 'error';
    setGPSText('GPS not supported');
    updateGPSDot(false);
    enableSearchIfReady();
    return;
  }

  setGPSText('Locating...');
  updateGPSDot(false);

  navigator.geolocation.getCurrentPosition(
    pos => {
      userLat = pos.coords.latitude;
      userLon = pos.coords.longitude;
      gpsStatus = 'success';
      setGPSText(`${userLat.toFixed(3)}°N  ${userLon.toFixed(3)}°E`);
      updateGPSDot(true);

      if (userMarker) map.removeLayer(userMarker);
      if (radiusCircle) map.removeLayer(radiusCircle);

      userMarker = L.circleMarker([userLat, userLon], {
        radius: 7, color: '#22cc77', fillColor: '#22cc77', fillOpacity: 1, weight: 3
      }).addTo(map);

      radiusCircle = L.circle([userLat, userLon], {
        radius: SEARCH_RADIUS_KM * 1000,
        color: '#00d4ff', fillColor: '#00d4ff',
        fillOpacity: 0.04, weight: 1, dashArray: '6 4'
      }).addTo(map);

      // If data loaded, show points
      if (fullData) {
        showCurrentModePoints();
      }
      enableSearchIfReady();
    },
    err => {
      console.warn('GPS error:', err.message);
      gpsStatus = 'denied';
      setGPSText('GPS denied');
      updateGPSDot(false);
      enableSearchIfReady();
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// ============================================================
//  SEARCH BUTTON
// ============================================================

document.getElementById('search-btn').addEventListener('click', () => {
  if (!fullData) {
    document.getElementById('results-text').innerHTML = '❌ Data not loaded yet.';
    return;
  }
  if (!userLat) {
    document.getElementById('results-text').innerHTML = '📍 Waiting for location...';
    return;
  }
  showCurrentModePoints();
});

// ============================================================
//  TOGGLE BUTTONS
// ============================================================

document.querySelectorAll('.toggle-option').forEach(el => {
  el.addEventListener('click', () => {
    const mode = el.dataset.mode;
    if (mode !== currentMode) {
      setMode(mode);
      // If search was already performed (has points), re-show
      if (userLat && fullData) {
        showCurrentModePoints();
      }
    }
  });
});

// ============================================================
//  SHEET & DRAG
// ============================================================

function collapseSheet() {
  const sheet = document.getElementById('sheet');
  sheet.style.height = '';
  sheet.classList.remove('full');
  sheet.classList.add('collapsed');
  document.getElementById('nav-count').textContent = hotspotResults.length;
}

document.getElementById('expand-btn').addEventListener('click', () => {
  const sheet = document.getElementById('sheet');
  sheet.classList.remove('collapsed');
  sheet.style.height = 'var(--sheet-mid)';
});

(function () {
  const sheet  = document.getElementById('sheet');
  const handle = document.getElementById('drag-handle');
  let startY, startH, dragging = false;

  function onStart(e) {
    dragging = true;
    startY   = e.touches ? e.touches[0].clientY : e.clientY;
    startH   = sheet.getBoundingClientRect().height;
    sheet.style.transition = 'none';
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    const y    = e.touches ? e.touches[0].clientY : e.clientY;
    const newH = Math.max(64, Math.min(window.innerHeight * 0.94, startH + (startY - y)));
    sheet.style.height = newH + 'px';
    sheet.classList.remove('collapsed', 'full');
    e.preventDefault();
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    const h  = sheet.getBoundingClientRect().height;
    const vh = window.innerHeight;
    if      (h < vh * 0.18) { sheet.classList.add('collapsed'); sheet.style.height = ''; }
    else if (h > vh * 0.75) { sheet.classList.add('full');      sheet.style.height = ''; }
    else                     { sheet.style.height = h + 'px'; }
  }

  handle.addEventListener('touchstart', onStart, { passive: false });
  handle.addEventListener('mousedown',  onStart);
  window.addEventListener('touchmove',  onMove,  { passive: false });
  window.addEventListener('mousemove',  onMove);
  window.addEventListener('touchend',   onEnd);
  window.addEventListener('mouseup',    onEnd);
})();

// ============================================================
//  INIT
// ============================================================

initGPS();
loadHotspotsData();
</script>
